name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Go Test
        run: |
          cd backend
          go test -v ./...

      - name: Docker Build Backend
        run: |
          cd backend
          docker build -t hidden-coast-backend .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Docker Build Frontend
        run: |
          cd frontend
          docker build -t hidden-coast-frontend .
